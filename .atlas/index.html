<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Atlas — Sidekit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Page title + one quiet status line -->
  <header class="page-head">
    <div class="page-head-inner">
      <h1 class="page-title">Project Atlas</h1>
      <p class="status-line" id="status-line"></p>
    </div>
  </header>

  <!-- Jump nav + search (sections in the locked order) -->
  <nav id="nav" class="nav">
    <ol class="nav-list">
      <li><a href="#vision">Vision</a></li>
      <li><a href="#progress">Progress</a></li>
      <li><a href="#decisions">Decisions</a></li>
      <li><a href="#ai-context">AI&nbsp;Context</a></li>
    </ol>
    <input id="search" class="search" type="search" placeholder="Filter…" aria-label="Filter dashboard" />
  </nav>

  <main id="atlas">
    <!-- Branch filter bar — global context for the kanban below -->
    <div id="branch-bar" class="branch-bar" role="region" aria-label="Branch filter"></div>

    <!-- 1) Vision -->
    <section id="vision" class="layer" data-layer="vision">
      <h2 class="layer-title">Vision</h2>
      <p class="layer-sub" id="vision-sub"></p>
      <div class="layer-body" id="vision-body"></div>
    </section>

    <!-- 2) Progress — kanban, filtered by the selected branch -->
    <section id="progress" class="layer" data-layer="progress">
      <h2 class="layer-title">Progress</h2>
      <p class="layer-sub" id="progress-sub"></p>
      <div class="layer-body" id="progress-body"></div>
    </section>

    <!-- 3) Decisions -->
    <section id="decisions" class="layer" data-layer="decisions">
      <h2 class="layer-title">Decisions</h2>
      <p class="layer-sub" id="decisions-sub"></p>
      <div class="layer-body" id="decisions-body"></div>
    </section>

    <!-- 4) AI Operating Context (no longer the hero position; moved to the bottom) -->
    <section id="ai-context" class="layer hero" data-layer="ai-context">
      <h2 class="layer-title">AI Operating Context</h2>
      <p class="layer-sub" id="ai-context-sub"></p>
      <div class="layer-body" id="ai-context-body"></div>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>
  <script src="app.js"></script>
</body>
</html>
