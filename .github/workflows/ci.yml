name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Sidekit.sln

      # Builds the whole solution, including Sidekit.WinApp (net8.0-windows),
      # which cannot be built on macOS — this is the real Windows-build check.
      - name: Build
        run: dotnet build Sidekit.sln -c Release --no-restore

      # Excludes the slow on-device Whisper integration test (Category=Integration,
      # Sidekit.Whisper.Tests, added in Brick 7). It downloads a model + runs whisper,
      # so it is run locally / in a future optional job, not in this fast push job.
      - name: Test
        run: dotnet test Sidekit.sln -c Release --no-build --filter "Category!=Integration"

      # Packaging smoke test (spec Feature 26): prove the self-contained single-file win-x64 publish
      # actually succeeds and emits the exe. Running that exe on a clean machine is the manual M-test.
      - name: Publish (single-file)
        run: dotnet publish Sidekit.WinApp/Sidekit.WinApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Verify the single-file exe exists
        shell: pwsh
        run: |
          $exe = "Sidekit.WinApp/bin/Release/net8.0-windows/win-x64/publish/Sidekit.exe"
          if (-not (Test-Path $exe)) { Write-Error "Publish did not produce $exe"; exit 1 }
          Write-Host ("Published {0:N1} MB single-file exe" -f ((Get-Item $exe).Length / 1MB))

      # Make the built exe downloadable: each run's "Artifacts" section gets Sidekit.exe, so the
      # app can be installed by downloading it from a green run — no .NET SDK / build needed.
      - name: Upload Sidekit.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sidekit-win-x64
          path: Sidekit.WinApp/bin/Release/net8.0-windows/win-x64/publish/Sidekit.exe
          if-no-files-found: error
